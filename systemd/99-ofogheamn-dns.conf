# Kernel tuning for a high-query-rate gaming DNS server.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384
net.core.netdev_max_backlog = 16384
net.core.somaxconn = 8192
net.ipv4.ip_local_port_range = 1024 65535
net.ipv4.tcp_fastopen = 3
net.ipv4.udp_early_demux = 1
fs.file-max = 2097152
# Allow the unprivileged service user to open ICMP ping sockets:
# the fastest-IP speed check measures game servers with ping.
net.ipv4.ping_group_range = 0 2147483647
# Forwarding for the WireGuard gaming tunnel (device -> server -> game)
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
# BBR + fq: fairer queueing for tunneled game traffic
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
