# ============================================================
#  Public encrypted-DNS service names — sinkholed ON PURPOSE.
#
#  "All subscriber DNS through this server" has a hole: apps
#  and browsers that speak DoH/DoT to a public resolver never
#  send a port-53 query at all. The gateway scripts close the
#  network side (redirect 53, drop 853, drop 443/853 to known
#  resolver IPs); this file closes the resolver side — a
#  client that asks THIS node to resolve a public DoH endpoint
#  gets NXDOMAIN, its encrypted channel cannot bootstrap, and
#  it falls back to the system DNS: this node.
#
#  Deliberately NOT listed: cloudflare-dns.com — this node's
#  own default group uses it as a DoH upstream hostname, and
#  sinkholing it would saw off the branch the node sits on.
#  (The gateway IP-block still covers Cloudflare for LANs.)
#
#  Remove a line if a name must resolve (e.g. you run your
#  own NextDNS profile); delete the include in smartdns.conf
#  to disable the whole layer.
# ============================================================
address /dns.google/#
address /dns.quad9.net/#
address /dns.adguard-dns.com/#
address /doh.cleanbrowsing.org/#
address /dns.nextdns.io/#
address /mozilla.cloudflare-dns.com/#
address /chrome.cloudflare-dns.com/#
address /doh.pub/#
address /dns.alidns.com/#
address /dns0.eu/#
address /private.canadianshield.cira.ca/#
address /dns.umbrella.com/#
address /doh.opendns.com/#
