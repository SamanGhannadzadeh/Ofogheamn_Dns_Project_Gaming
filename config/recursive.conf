# ============================================================
#  Optional recursive back-end (ships INERT — comments only).
#
#  `ofogheamn-dns recursive enable` writes one line here that
#  adds the node's local Unbound (127.0.0.1:5335, config in
#  unbound.conf, unit ofogheamn-recursive.service) as an
#  upstream in the default group AND in a named "recursive"
#  group for per-domain routing:
#
#    server 127.0.0.1:5335 -group recursive
#
#  SmartDNS then races it against the public upstreams like
#  any other server: cold answers cost a full recursion, warm
#  answers are local, and no single public resolver sees the
#  node's whole query stream. `recursive disable` restores
#  this comment-only file. A missing conf-file is fatal to
#  SmartDNS, which is why this file always ships.
# ============================================================
