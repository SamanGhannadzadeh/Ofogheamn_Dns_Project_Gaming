# Ofogheamn PPTP server (pptpd).
# Managed by the project: install.sh copies this to /etc/pptpd.conf.
# Client pool 10.68.0.0/24 is NATed out of the node by
# ofogheamn-vpn-setup; DNS pushed to clients is the node itself
# (10.68.0.1) via /etc/ppp/options.pptpd. MPPE-128 is required
# there — PPTP without encryption is not offered at all.
option /etc/ppp/options.pptpd
logwtmp
localip 10.68.0.1
remoteip 10.68.0.10-250
