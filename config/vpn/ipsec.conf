# Ofogheamn L2TP/IPsec — strongSwan (IKEv1, PSK) for xl2tpd.
# Managed by the project: install.sh copies this to /etc/ipsec.conf.
# The PSK itself is NOT here — it lives in /etc/ofogheamn-dns/vpn.conf
# and is rendered into /etc/ipsec.secrets by ofogheamn-vpn-setup.
config setup
    uniqueids=no

conn L2TP-PSK
    authby=secret
    pfs=no
    auto=add
    keyingtries=3
    rekey=no
    ikelifetime=8h
    keylife=1h
    type=transport
    left=%any
    leftid=%any
    leftprotoport=17/1701
    right=%any
    rightprotoport=17/%any
    # Broad proposal set on purpose: the native clients this exists
    # for (Windows, Android, routers) span two decades of IKEv1.
    ike=aes256-sha256-modp2048,aes256-sha1-modp1024,aes128-sha1-modp1024,3des-sha1-modp1024!
    esp=aes256-sha256,aes256-sha1,aes128-sha1,3des-sha1!
    dpddelay=30
    dpdtimeout=120
    dpdaction=clear
