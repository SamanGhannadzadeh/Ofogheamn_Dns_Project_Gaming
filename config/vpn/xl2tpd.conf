; Ofogheamn L2TP server (LNS) — pairs with strongSwan IPsec.
; Managed by the project: install.sh copies this to
; /etc/xl2tpd/xl2tpd.conf. Client pool 10.67.0.0/24 is NATed out
; of the node by ofogheamn-vpn-setup; DNS pushed to clients is the
; node itself (10.67.0.1) via /etc/ppp/options.xl2tpd.
[global]
ipsec saref = no
listen-addr = 0.0.0.0

[lns default]
ip range = 10.67.0.10-10.67.0.250
local ip = 10.67.0.1
require chap = yes
refuse pap = yes
require authentication = yes
name = OfogheamnL2TP
ppp debug = no
pppoptfile = /etc/ppp/options.xl2tpd
length bit = yes
