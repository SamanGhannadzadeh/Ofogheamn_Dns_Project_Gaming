# ============================================================
#  Smart-DNS hijack rules — this server answers these names itself.
#  Managed by:  ofogheamn-dns add-hijack <domain> <ipv4>
#               ofogheamn-dns remove-hijack <domain>
#  Syntax reference (SmartDNS):
#    address /domain/1.2.3.4        fixed A answer (use - for NXDOMAIN)
#    address /domain/::1            fixed AAAA answer
#    cname   /domain/target         alias
#    nameserver /domain/group       send this name to an upstream group
#    domain-rules /domain/ -no-cache -no-speed-check ...
#
#  Example (region-unlock endpoint): point a service's domains at
#  your own unlock node so its traffic exits where you choose:
#    address /api.example-service.com/203.0.113.10
# ============================================================
