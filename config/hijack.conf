# ============================================================
#  Smart-DNS hijack rules — this server answers these names itself.
#  Managed by:  ofogheamn-dns add-hijack <domain> <ipv4>
#               ofogheamn-dns remove-hijack <domain>
#  Syntax reference (SmartDNS):
#    address /domain/1.2.3.4        fixed A answer (use # for NXDOMAIN —
#                                    the "-" form is NOT answered locally
#                                    by SmartDNS Release48.5; proven v1.4)
#    address /domain/::1            fixed AAAA answer
#    cname   /domain/target         alias
#    nameserver /domain/group       send this name to an upstream group
#    domain-rules /domain/ -no-cache -no-speed-check ...
#
#  Example (region-unlock endpoint): point a service's domains at
#  your own unlock node so its traffic exits where you choose:
#    address /api.example-service.com/203.0.113.10
#
#  Dual-stack rule (v1.9): add-hijack always writes TWO lines —
#  the A answer you asked for and an AAAA line. Without the AAAA
#  line, AAAA queries leak upstream and dual-stack clients walk
#  straight past the rule. The default AAAA is "::" (answered
#  locally, unusable as a route); pass a real IPv6 as the third
#  argument when your endpoint has one:
#    ofogheamn-dns add-hijack api.example.com 203.0.113.10 2001:db8::10
#  Bulk form (a service's whole domain list, one relay):
#    ofogheamn-dns add-hijack --file domains.txt 203.0.113.10
# ============================================================
