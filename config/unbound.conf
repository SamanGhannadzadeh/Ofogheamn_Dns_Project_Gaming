# Ofogheamn recursive back-end — Unbound on 127.0.0.1:5335.
# Fronted by SmartDNS (fastest-IP selection, gaming rules and
# the hot cache live there); this layer's job is independence:
# full recursion from the root, so the node keeps resolving
# even when every public upstream is unreachable or filtered,
# and no single provider sees the whole query stream.
server:
  interface: 127.0.0.1
  port: 5335
  do-ip6: no
  access-control: 127.0.0.0/8 allow
  num-threads: 1
  msg-cache-size: 32m
  rrset-cache-size: 64m
  cache-min-ttl: 0
  cache-max-negative-ttl: 60
  # RFC 8767 serve-expired + prefetch: the same always-warm
  # philosophy as the SmartDNS layer in front of it.
  serve-expired: yes
  prefetch: yes
  hide-identity: yes
  hide-version: yes
  harden-glue: yes
  harden-dnssec-stripped: yes
  # Deliberately NOT set:
  # - auto-trust-anchor-file: DNSSEC validation stays off,
  #   matching the front layer's posture (latency first; a
  #   bogus-domain SERVFAIL helps no gamer). Add the distro
  #   root.key path here if you want validation.
  # - qname-minimisation: extra cold-name round trips; the
  #   privacy win here is recursion itself, not minimisation.
