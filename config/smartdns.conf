# ============================================================
#  Ofogheamn DNS Project — Gaming Edition
#  Core resolver: SmartDNS (fastest-IP selection engine)
#  Docs: https://github.com/saman-ghannadzadeh/Ofogheamn_Dns_Project_Gaming
# ============================================================

# ---------- listeners (client-facing protocols) ----------
# Plain DNS (UDP+TCP 53) — consoles, routers, legacy clients
bind [::]:53
bind-tcp [::]:53
# DNS-over-TLS (RFC 7858) — Android Private DNS, systemd-resolved
bind-tls [::]:853 -group gaming -no-speed-check -ddr
# DNS-over-HTTPS (RFC 8484) — browsers, iOS profiles
bind-https [::]:443 -group gaming -no-speed-check -ddr

# TLS material for DoT/DoH (installer generates a self-signed pair
# by default; replace with a real certificate for public service).
# The files MUST exist: SmartDNS exits at startup when they are
# missing (verified with the Release48.5 binary — there is no
# auto-generation despite what older comments here claimed).
bind-cert-file /etc/ofogheamn-dns/tls/fullchain.pem
bind-cert-key-file /etc/ofogheamn-dns/tls/privkey.pem
bind-cert-san dns.ofogheamn.ir

# ---------- identity / housekeeping ----------
server-name ofogheamn-dns
cache-size 262144
cache-persist yes
cache-checkpoint-time 300
cache-file /var/cache/ofogheamn-dns/smartdns.cache
log-level info
log-file /var/log/ofogheamn-dns/smartdns.log
log-size 64m
log-num 4
audit-enable no
dns64 64:ff9b::/96

# ---------- gaming speed engine ----------
# The strict measurement (ICMP ping + TCP connect, fastest-IP
# selection) lives in the per-domain rules for the gaming and CoD
# lists below, where it decides real game-server IPs. The GLOBAL
# default is OFF: on the first live node (2026-11-20) probing every
# candidate for ordinary names made each cold lookup pay ~0.5 s
# (950 ms cold -> ~80 ms with it off), for names where the fastest
# CDN IP is not a game server and the probe buys nothing.
speed-check-mode none
response-mode fastest-response
dualstack-ip-selection yes
dualstack-ip-selection-threshold 50
# Keep answers fresh for matchmaking, but never below 30 s.
rr-ttl-min 30
rr-ttl-max 3600
rr-ttl-reply-max 60
# Serve the last known answer while revalidating in background:
# a gamer never waits on an expired TTL mid-session.
serve-expired yes
serve-expired-ttl 259200
serve-expired-reply-ttl 3
prefetch-domain no
# Blanket prefetch is OFF on purpose (2026 resolver evidence:
# wasteful and weak). Curated warming of the gaming/CoD lists by
# cod-warmup.timer is this project's prefetch — it also refreshes
# the fastest-IP measurement, which plain prefetch does not.
# Send the client's /24 to upstreams so CDN/game edges answer with
# a nearby node. Set to your real client ranges in production.
# --- Where do answers point? THE NODE is the location. --------
# No ECS is sent by default: upstreams geolocate by THIS server's
# IP, so a node hosted abroad (near the game datacenters) returns
# game edges near the node — which is the whole point of running
# Ofogheamn on a foreign server: requests leave from there.
# Operators running a node INSIDE the players' own country who
# prefer player-side CDN mapping may enable ECS instead:
# edns-client-subnet 0.0.0.0/24

# ---------- upstream groups ----------
# gaming: anycast resolvers with global game-edge coverage.
# DoT + plain UDP only on this latency-critical path (live-node
# evidence, 2026-11-20: the DoH members stalled cold gaming
# lookups for seconds on a real VPS route and QUIC/H3 added
# handshake drag; DoT keeps the same encryption with far less
# overhead, UDP is the 1-RTT fallback). The default group below
# keeps the full DoH/QUIC ladder for ordinary names.
server-tls 1.1.1.1 -group gaming -exclude-default-group
server-tls 1.0.0.1 -group gaming -exclude-default-group
server-tls 8.8.8.8 -group gaming -exclude-default-group
server-tls 8.8.4.4 -group gaming -exclude-default-group
server-tls 9.9.9.9 -group gaming -exclude-default-group
server-tls 9.9.9.11 -group gaming -exclude-default-group
server 1.1.1.1 -group gaming -exclude-default-group
server 8.8.8.8 -group gaming -exclude-default-group
server-quic 1.1.1.1 -group gaming -exclude-default-group
server-h3 h3://1.1.1.1/dns-query -group gaming -exclude-default-group

# bootstrap/default group (everything not matched by a rule below)
# DoQ/DoH3 included: from the NODE (abroad) QUIC is healthy and wins
# big on lossy paths (research: p99 lookup 310 ms DoQ vs 1,225 ms
# DoT/DoH at 2% loss). SmartDNS races them against DoT/DoH and falls
# back automatically, so QUIC is never the only path.
server-https https://cloudflare-dns.com/dns-query
server-tls 1.1.1.1
server-quic 1.1.1.1
server-quic 9.9.9.9
server-h3 h3://1.1.1.1/dns-query
server 1.1.1.1
server 8.8.8.8

# ---------- gaming domains -> fastest-IP group ----------
# Full list lives in lists/gaming.domains (one domain per line is
# expanded by install/update into domain-set form below).
domain-set -name gaming -file /etc/ofogheamn-dns/lists/gaming.domains
nameserver /domain-set:gaming/gaming
domain-rules /domain-set:gaming/ -speed-check-mode ping,tcp:443,tcp:80 -response-mode fastest-ip

# ---------- Call of Duty / Warzone — dedicated treatment ----------
# Demonware (CoD's backend) picks its regional endpoints by DNS.
# These names get the strictest measurement: ping + tcp:443 speed
# check, fastest-response selection, and the cache warmer
# (cod-warmup.timer) keeps a fresh fastest answer ready 24/7, so
# launching Warzone never waits on a cold lookup.
domain-set -name cod -file /etc/ofogheamn-dns/lists/cod.domains
nameserver /domain-set:cod/gaming
domain-rules /domain-set:cod/ -speed-check-mode tcp:443 -response-mode fastest-response

# ---------- force all subscriber DNS through this server ----------
conf-file /etc/ofogheamn-dns/force-dns.conf

# ---------- Smart-DNS hijack rules ----------
# "Hijack" = this server answers authoritatively for chosen names:
#   address /example.com/203.0.113.10   fixed IP answer
#   cname   /www.example.com/target    alias answer
#   nameserver /example.com/group      route to a special upstream
# Managed day-to-day with:  ofogheamn-dns add-hijack <domain> <ip>
conf-file /etc/ofogheamn-dns/hijack.conf

# Optional ad/tracker blocklist (ships empty; enable in hijack.conf
# style with address /domain/-  to sinkhole a name.)
conf-file /etc/ofogheamn-dns/blocklist.conf

# Ofogheamn Mesh writes chained-upstream rules here (empty = direct)
conf-file /etc/ofogheamn-dns/mesh-upstream.conf

# Optional recursive back-end (ships inert; toggled by
# `ofogheamn-dns recursive enable` — see recursive.conf)
conf-file /etc/ofogheamn-dns/recursive.conf

# Public encrypted-DNS names are NOT sinkholed. Standing product
# decision (owner, 2026-11-21): every domain passes and resolves —
# nothing is blocked by default. An earlier default sinkholed
# public DoH/DoT resolver names so subscriber apps could not
# bypass this node; that default is removed. To opt in anyway,
# load doh-resolvers.conf here with a conf-file line — the file
# itself documents the reasoning and its one deliberate
# exception.
