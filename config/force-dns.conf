# ============================================================
#  Force-through-DNS: stop subscriber devices from silently
#  bypassing this resolver.
#
#  1) The standard canary: use-application-dns.net answers
#     NXDOMAIN (SmartDNS "#" form — verified: status NXDOMAIN,
#     0 answers). Browsers checking the canary therefore do not
#     auto-upgrade to a public DoH resolver (the canary-domain
#     mechanism). The hard guarantee is layers 2+3 in gateway/.
#  2) Gateway rules (see gateway/ folder) redirect plain
#     port-53 traffic to this server and block direct DoT/853
#     egress, for networks you operate.
#
#  The aggressive sinkhole list at the bottom stays COMMENTED:
#  "#" answers with SOA/no-address, so apps get no usable
#  endpoint. It deliberately excludes cloudflare-dns.com and
#  dns.google — those are THIS server's own DoH upstreams.
# ============================================================
address /use-application-dns.net/#

# Apple Private Relay bypasses local DNS entirely. Operators who
# need every lookup on this server disable it on their network by
# NXDOMAIN-ing its masks (Apple's own documented mechanism):
# address /mask.icloud.com/#
# address /mask-h2.icloud.com/#

# --- optional aggressive mode (uncomment to enable) ---
# address /dns.quad9.net/#
# address /dns.adguard-dns.com/#
# address /doh.opendns.com/#
# address /dns.nextdns.io/#
